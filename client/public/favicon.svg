<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="40%" stop-color="#DFB76C" />
      <stop offset="70%" stop-color="#B38728" />
      <stop offset="100%" stop-color="#FBF5B7" />
    </linearGradient>
    <linearGradient id="favCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E1D2D" />
      <stop offset="70%" stop-color="#4A0B14" />
      <stop offset="100%" stop-color="#240408" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Stationery Shield -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#favCrimson)" stroke="url(#favGold)" stroke-width="2" />
  
  <!-- Inner Embossed Stationery Dashed Line -->
  <rect x="13" y="13" width="74" height="74" rx="14" fill="none" stroke="url(#favGold)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.9" />

  <!-- Royal Lotus Apex Finial -->
  <path d="M50 4 L53 10 C56.5 9 58.5 11.5 57 14 C54.5 14 52 12.5 50 10.5 C48 12.5 45.5 14 43 14 C41.5 11.5 43.5 9 47 10 Z" fill="url(#favGold)" />
  <circle cx="50" cy="3" r="1.5" fill="url(#favGold)" />

  <!-- Monogram "K" -->
  <text x="50" y="63" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="42" font-weight="700" fill="url(#favGold)" text-anchor="middle">K</text>

  <!-- Bottom Fold Accent & Diamond -->
  <path d="M40 76 Q50 82 60 76" fill="none" stroke="url(#favGold)" stroke-width="1.2" stroke-linecap="round" />
  <polygon points="50,78 52.5,81.5 50,85 47.5,81.5" fill="url(#favGold)" />
</svg>